# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: inspect render types (temporary)
        if: always()
        run: |
          MJ=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -name 'minecraft-clientonly-1*.jar' ! -name '*intermediary*' | head -1)
          echo "###A"; javap -cp "$MJ" -p net.minecraft.client.renderer.rendertype.RenderType | grep -E "create|static" | head -20
          echo "###B"; javap -cp "$MJ" -p net.minecraft.client.renderer.rendertype.RenderSetup 'net.minecraft.client.renderer.rendertype.RenderSetup$RenderSetupBuilder' | head -60
          echo "###C"; javap -cp "$MJ" -p 'com.mojang.blaze3d.pipeline.RenderPipeline$Builder' | head -50
          echo "###D"; javap -cp "$MJ" -p net.minecraft.client.renderer.RenderPipelines | grep -iE "LINES|DEBUG_QUADS|SNIPPET" | head -20
          echo "###E"; javap -cp "$MJ" -p com.mojang.blaze3d.platform.DepthTestFunction | head -12
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
