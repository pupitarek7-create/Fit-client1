# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: inspect api (temporary)
        if: always()
        run: |
          FJ=$(find ~/.gradle -name 'fabric-rendering-v1*.jar' ! -name '*sources*' | head -1)
          javap -cp "$FJ" net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderContext 'net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents$BeforeTranslucent' 'net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents$EndMain' | head -80
          echo ---JARS; find ~/.gradle/caches/fabric-loom -name '*.jar' | head -20
          MJ=$(find ~/.gradle/caches/fabric-loom -name '*.jar' | xargs -I{} sh -c 'unzip -l {} 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class" && echo {}' | head -1)
          echo MJ=$MJ
          unzip -l "$MJ" | grep -E "renderer/rendertype/|renderer/RenderType|renderer/ShapeRenderer|vertex/VertexConsumer|vertex/PoseStack" | head -40
          javap -cp "$MJ" com.mojang.blaze3d.vertex.VertexConsumer | head -40
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
