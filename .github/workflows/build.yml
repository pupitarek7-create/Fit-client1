# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: inspect api (temporary)
        if: always()
        run: |
          for j in $(find ~/.gradle -name 'fabric-rendering-v1*.jar' ! -name '*sources*' | head -3); do echo "== $j"; unzip -l $j | grep -iE "WorldRender" | head -30; done
          for j in $(find ~/.gradle -name '*minecraft*merged*.jar' -o -name 'minecraft-clientOnly*.jar' | head -3); do echo "== $j"; unzip -l $j | grep -E "renderer/rendertype/|renderer/RenderType|ShapeRenderer|renderer/debug/DebugRenderer\.class" | head -30; done
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
